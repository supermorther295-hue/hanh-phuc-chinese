<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Đọc - 幸福中文</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        /* CSS dùng để ẩn Pinyin và Nghĩa tiếng Việt khi tắt chế độ */
        .hide-extra .pinyin-text,
        .hide-extra .meaning-text {
            display: none !important;
        }
        ::selection {
            background-color: #fef08a;
            color: #854d0e;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 relative min-h-screen pb-20">

    <!-- POPUP TRA TỪ KHI BÔI ĐEN -->
    <div id="wordPopup" class="hidden absolute z-50 bg-slate-900 text-white p-4 rounded-2xl shadow-xl border border-slate-700 text-xs max-w-xs transition-all">
        <div class="flex justify-between items-center mb-1 gap-4">
            <span id="popupWord" class="font-bold text-base text-amber-400"></span>
            <button onclick="closeWordPopup()" class="text-slate-400 hover:text-white font-bold text-sm">✕</button>
        </div>
        <div id="popupDetails" class="space-y-1 mb-3">
            <p id="popupPinyin" class="text-blue-400 font-semibold text-xs"></p>
            <p id="popupMeaning" class="text-slate-200 text-xs"></p>
        </div>
        <button onclick="saveWordToPersonalDict()" id="saveWordBtn" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition text-xs flex items-center justify-center gap-1 shadow-md">
            ⭐ Lưu vào Sổ từ vựng cá nhân
        </button>
    </div>

    <div class="max-w-3xl mx-auto p-6 bg-white shadow-lg my-10 rounded-xl">
        <!-- Nút quay lại & Công tắc Bật/Tắt Pinyin & Nghĩa -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <a href="index.html" class="text-blue-600 font-semibold hover:underline">← Quay lại danh sách</a>
            
            <label class="flex items-center cursor-pointer bg-amber-50 px-4 py-2 rounded-xl border border-amber-200 select-none">
                <input type="checkbox" id="pinyinToggleCheckbox" checked onchange="togglePinyinAndMeaning()" class="w-4 h-4 rounded mr-2 accent-amber-600">
                <span class="text-xs font-bold text-amber-800">Hiển thị Pinyin & Nghĩa</span>
            </label>
        </div>

        <!-- Tiêu đề bài học -->
        <h1 id="post-title" class="text-2xl font-bold mb-2">Đang tải tiêu đề...</h1>
        <span id="post-level" class="inline-block px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold mb-6"></span>

        <!-- Hướng dẫn bôi đen -->
        <div class="text-[11px] text-slate-400 bg-slate-50 p-2.5 rounded-lg mb-4 flex items-center gap-1.5 border border-slate-100">
            💡 <span>Tip: <b>Bôi đen (Highlight)</b> từ tiếng Trung bất kỳ trong bài để xem nghĩa tiếng Việt và lưu nhanh vào Sổ từ vựng cá nhân.</span>
        </div>

        <!-- Nội dung bài đọc -->
        <div id="article-container" class="space-y-4">
            <div id="article-content" class="space-y-4 text-lg leading-relaxed">
                <!-- Dữ liệu từng câu sẽ được render ở đây -->
            </div>
        </div>

        <!-- Mục Ngữ pháp quan trọng -->
        <div class="mt-10 p-5 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg">
            <h3 class="font-bold text-blue-900 text-lg mb-2">📌 Điểm ngữ pháp quan trọng trong bài</h3>
            <div id="post-grammar" class="text-gray-700 space-y-2">
                <!-- Nội dung ngữ pháp -->
            </div>
        </div>

        <!-- NÚT ĐÁNH DẤU HOÀN THÀNH BÀI HỌC -->
        <div class="mt-10 pt-6 border-t border-gray-200 text-center space-y-3">
            <button id="completeBtn" onclick="markAsCompleted()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition text-sm flex items-center justify-center gap-2 mx-auto">
                ✅ Đánh dấu ĐÃ HOÀN THÀNH bài đọc này
            </button>
            <p id="completionStatus" class="text-xs text-emerald-600 font-semibold hidden">🎉 Bài đọc này đã được lưu vào tiến độ cá nhân của bạn!</p>
        </div>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBtrlwBm1ouRhinkKiNeOZTSjwr4xCeUUY",
            authDomain: "hanhphuc114-47ee3.firebaseapp.com",
            projectId: "hanhphuc114-47ee3",
            storageBucket: "hanhphuc114-47ee3.firebasestorage.app",
            messagingSenderId: "160765310205",
            appId: "1:160765310205:web:e3a21bd5a7082587133a94",
            measurementId: "G-C5L19WCC4G"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        let currentLessonTitle = "";
        let selectedWordText = "";
        let selectedWordMeaning = "";

        // Từ điển mẫu tra cứu nhanh (Bạn có thể bổ sung thêm tùy ý)
        const miniDict = {
            "平时": { pinyin: "píngshí", meaning: "thường ngày, bình thường" },
            "周末": { pinyin: "zhōumò", meaning: "cuối tuần" },
            "喜欢": { pinyin: "xǐhuan", meaning: "thích, yêu thích" },
            "做什么": { pinyin: "zuò shénme", meaning: "làm gì" },
            " Pinyin ": { pinyin: "", meaning: "" },
            "工作": { pinyin: "gōngzuò", meaning: "công việc, làm việc" },
            "很": { pinyin: "hěn", meaning: "rất" },
            "忙": { pinyin: "máng", meaning: "bận rộn" },
            "所以": { pinyin: "suǒyǐ", meaning: "cho nên, vì vậy" },
            "对": { pinyin: "duì", meaning: "đối với" },
            "非常": { pinyin: "fēicháng", meaning: "vô cùng, cực kỳ" },
            "重要": { pinyin: "zhòngyào", meaning: "quan trọng" },
            "朋友": { pinyin: "péngyou", meaning: "bạn bè" },
            "常常": { pinyin: "chángcháng", meaning: "thường xuyên" },
            " and ": { pinyin: "", meaning: "" }
        };

        if (postId) {
            db.collection("posts").doc(postId).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    currentLessonTitle = data.title;
                    document.getElementById('post-title').innerText = data.title;
                    document.getElementById('post-level').innerText = data.level || 'HSK';
                    
                    let contentHtml = "";
                    if(data.sentences && Array.isArray(data.sentences) && data.sentences.length > 0) {
                        data.sentences.forEach((item) => {
                            contentHtml += `
                                <div class="p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition flex justify-between items-center gap-4">
                                    <div>
                                        <p class="text-xl font-medium text-gray-900 select-text">${item.chinese}</p>
                                        <p class="pinyin-text text-xs text-blue-600 font-semibold mt-1">${item.pinyin || ''}</p>
                                        <p class="meaning-text text-sm text-gray-500 mt-0.5">${item.meaning || ''}</p>
                                    </div>
                                    <button onclick="playAudio('${item.chinese.replace(/'/g, "\\'")}')" class="px-3 py-1.5 bg-blue-600 text-white rounded-md text-xs hover:bg-blue-700 whitespace-nowrap">
                                        🔊 Nghe câu
                                    </button>
                                </div>
                            `;
                        });
                    } else if (data.content) {
                        contentHtml = `<div class="p-5 bg-gray-50 rounded-lg"><p class="text-lg text-gray-900 leading-relaxed select-text">${data.content}</p></div>`;
                    } else {
                        contentHtml = `<p>Chưa có nội dung chi tiết cho bài này.</p>`;
                    }
                    document.getElementById('article-content').innerHTML = contentHtml;
                    document.getElementById('post-grammar').innerHTML = data.grammar ? data.grammar.replace(/\n/g, '<br>') : "Không có điểm ngữ pháp chuyên sâu trong bài này.";
                }
            });
        }

        function togglePinyinAndMeaning() {
            const isChecked = document.getElementById('pinyinToggleCheckbox').checked;
            const container = document.getElementById('article-container');
            if (isChecked) {
                container.classList.remove('hide-extra');
            } else {
                container.classList.add('hide-extra');
            }
        }

        async function markAsCompleted() {
            if (!currentLessonTitle) return;
            try {
                await db.collection("user_progress").add({
                    userName: "Học viên",
                    lesson: currentLessonTitle,
                    lessonId: postId,
                    completedAt: new Date()
                });
                const btn = document.getElementById('completeBtn');
                btn.className = "px-8 py-3.5 bg-slate-200 text-slate-600 font-bold rounded-2xl cursor-not-allowed text-sm flex items-center justify-center gap-2 mx-auto";
                btn.innerHTML = "🎉 Đã ghi nhận hoàn thành";
                btn.disabled = true;
                document.getElementById('completionStatus').classList.remove('hidden');
            } catch (e) {
                console.error(e);
            }
        }

        // BÔI ĐEN TRA TỪ TỰ ĐỘNG
        document.addEventListener('mouseup', function(e) {
            const selection = window.getSelection();
            const text = selection.toString().trim();

            if (text && /[\u4e00-\u9fa5]/.test(text)) {
                selectedWordText = text;
                const popup = document.getElementById('wordPopup');
                document.getElementById('popupWord').innerText = text;

                // Kiểm tra xem từ bôi đen có trong từ điển mini không
                if (miniDict[text]) {
                    selectedWordMeaning = miniDict[text].meaning;
                    document.getElementById('popupPinyin').innerText = `Pinyin: ${miniDict[text].pinyin}`;
                    document.getElementById('popupMeaning').innerText = `Nghĩa: ${miniDict[text].meaning}`;
                } else {
                    selectedWordMeaning = "Từ vựng tra cứu nhanh";
                    document.getElementById('popupPinyin').innerText = "";
                    document.getElementById('popupMeaning').innerText = `Nghĩa: [Đã chọn] ${text}`;
                }

                popup.style.top = `${e.pageY + 10}px`;
                popup.style.left = `${Math.min(e.pageX - 50, window.innerWidth - 220)}px`;
                popup.classList.remove('hidden');
            }
        });

        function closeWordPopup() {
            document.getElementById('wordPopup').classList.add('hidden');
        }

        async function saveWordToPersonalDict() {
            if (!selectedWordText) return;
            const btn = document.getElementById('saveWordBtn');
            btn.innerText = "⏳ Đang lưu...";

            try {
                await db.collection("user_vocabulary").add({
                    word: selectedWordText,
                    meaning: selectedWordMeaning,
                    lessonTitle: currentLessonTitle,
                    savedAt: new Date()
                });
                btn.innerText = "✓ Đã lưu vào sổ từ!";
                btn.className = "w-full py-2 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center gap-1 cursor-default";
                setTimeout(() => { closeWordPopup(); }, 1200);
            } catch (e) {
                console.error(e);
                alert("Lỗi khi lưu từ vựng.");
            }
        }

        function playAudio(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN'; 
                utterance.rate = 0.85; 
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
